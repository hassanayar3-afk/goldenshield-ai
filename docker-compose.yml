services:
  goldenshield:
    build: .
    container_name: goldenshield-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      EXECUTION_MODE: paper
      PYTHONIOENCODING: utf-8
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "deployment/health_check.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
