services:
  goldenshield:
    build: .
    container_name: goldenshield-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      # لا نفرض paper هنا — يُؤخذ من .env (Demo: live + BINANCE_DEMO_TRADING=true)
      EXECUTION_MODE: ${EXECUTION_MODE:-live}
      BINANCE_DEMO_TRADING: ${BINANCE_DEMO_TRADING:-true}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-binance}
      PYTHONIOENCODING: utf-8
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "deployment/health_check.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
