# GoldenShield — reverse proxy جاهز للمرحلة 10 (SaaS API)
# حالياً: /health فقط عبر حاوية اختيارية أو upstream مستقبلي على :8000
#
# تفعيل لاحقاً:
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/goldenshield
#   sudo ln -sf /etc/nginx/sites-available/goldenshield /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream goldenshield_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SaaS API (بعد المرحلة 10)
    location /api/ {
        proxy_pass http://goldenshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        return 404 "GoldenShield bot — API not exposed yet\n";
        add_header Content-Type text/plain;
    }
}
