<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoldenShield Terminal</title>
  <link rel="stylesheet" href="/js/ui_components.css" />
</head>
<body>
  <header class="gs-header">
    <h1>GoldenShield Terminal</h1>
    <p id="status-line">جاري التحميل…</p>
  </header>

  <section class="gs-card gs-pair" id="pair-card">
    <h2>ربط الجهاز</h2>
    <label>رمز الربط<input type="text" id="pair-code" autocomplete="off" /></label>
    <label>اسم الجهاز<input type="text" id="device-name" value="WebPanel" /></label>
    <button type="button" class="gs-btn" id="btn-pair">ربط</button>
    <p class="gs-muted" id="pair-status"></p>
  </section>

  <main class="gs-grid">
    <section class="gs-card" id="account-card">
      <h2>المحفظة</h2>
      <div id="account-body">—</div>
    </section>
    <section class="gs-card" id="stack-card">
      <h2>Stack / Battalion</h2>
      <pre id="stack-body" class="gs-pre">—</pre>
    </section>
    <section class="gs-card" id="orderbook-card">
      <h2>Order Book (WS)</h2>
      <ul id="orderbook-list"></ul>
    </section>
    <section class="gs-card" id="signals-card">
      <h2>الإشارات</h2>
      <ul id="signals-list"></ul>
    </section>
    <section class="gs-card" id="controls-card">
      <h2>التحكم</h2>
      <div id="pocket-lock-panel"></div>
      <button type="button" class="gs-btn" id="btn-refresh">تحديث</button>
      <button type="button" class="gs-btn gs-warn" id="btn-pause">إيقاف الدخول</button>
      <button type="button" class="gs-btn gs-danger" id="btn-panic">طوارئ</button>
    </section>
  </main>
  <script src="/js/api_client.js"></script>
  <script src="/js/pocket_lock_ui.js"></script>
  <script src="/js/ui_components.js"></script>
</body>
</html>
