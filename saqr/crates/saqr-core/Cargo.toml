[package]
name = "saqr-core"
version.workspace = true
edition.workspace = true

[dependencies]
parking_lot = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
rocksdb = []
