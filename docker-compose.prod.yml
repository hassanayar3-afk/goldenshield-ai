# إنتاج Contabo — يُستخدم مع: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  goldenshield:
    restart: always
    environment:
      ENV: production
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      TELEGRAM_SEND_CYCLE_SIGNALS: "false"
      TELEGRAM_SIGNALS_ONLY: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "deployment/health_check.py"]
      interval: 45s
      timeout: 20s
      retries: 5
      start_period: 60s
